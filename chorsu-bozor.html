<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHORSU — Bozor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14171D;
    --surface: #1C212A;
    --surface-2: #232A34;
    --line: #2C333F;
    --teal: #36A79C;
    --teal-dim: #285E58;
    --gold: #D9A64C;
    --terracotta: #C4633C;
    --text: #ECEEF1;
    --text-dim: #93A0AC;
    --text-faint: #5E6873;
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1,h2,h3,.disp{
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    margin: 0;
  }
  button{ font-family: inherit; cursor: pointer; }
  ::-webkit-scrollbar{ display:none; }
  * { scrollbar-width: none; }

  #shell{
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--bg);
    position: relative;
    display:flex;
    flex-direction:column;
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
  }

  /* header */
  #topbar{
    position: sticky; top:0; z-index:20;
    background: linear-gradient(180deg, var(--bg) 70%, rgba(20,23,29,0));
    padding: 18px 16px 10px;
  }
  .brand-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .brand{ display:flex; align-items:center; gap:9px; }
  .brand-mark{
    width:34px; height:34px; border-radius: 9px;
    background: conic-gradient(from 220deg, var(--teal), var(--gold), var(--terracotta), var(--teal));
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk'; font-weight:700; color:#101317; font-size:15px;
  }
  .brand-name{ font-size:19px; letter-spacing:0.2px; }
  .brand-sub{ font-size:11px; color:var(--text-faint); margin-top:-2px; }
  #admin-entry{
    width:34px; height:34px; border-radius:9px; border:1px solid var(--line);
    background:var(--surface); color:var(--text-dim); display:flex; align-items:center; justify-content:center;
    font-size:15px;
  }
  #search-wrap{ position:relative; }
  #search{
    width:100%; padding: 12px 14px 12px 40px; border-radius: 11px;
    border: 1px solid var(--line); background: var(--surface); color: var(--text);
    font-size: 14px; outline:none;
  }
  #search::placeholder{ color: var(--text-faint); }
  #search-wrap::before{
    content:"⌕"; position:absolute; left:13px; top:50%; transform:translateY(-52%);
    color: var(--text-faint); font-size:17px;
  }

  /* categories */
  #cats{
    display:flex; gap:8px; overflow-x:auto; padding: 14px 16px 4px;
  }
  .cat-chip{
    flex: 0 0 auto; display:flex; flex-direction:column; align-items:center; gap:6px;
    width: 66px; padding: 10px 4px; border-radius: 12px; border:1px solid transparent;
    background: transparent; color: var(--text-dim);
  }
  .cat-chip .ic{
    width:42px; height:42px; border-radius:12px; background:var(--surface);
    display:flex; align-items:center; justify-content:center; font-size:19px;
    border:1px solid var(--line);
  }
  .cat-chip span{ font-size:10.5px; text-align:center; line-height:1.2; }
  .cat-chip.active .ic{ background: var(--teal-dim); border-color: var(--teal); }
  .cat-chip.active{ color: var(--text); }

  /* main scroll area */
  #main{ flex:1; padding: 6px 16px 90px; overflow-y:auto; }
  .section-head{ display:flex; align-items:baseline; justify-content:space-between; margin: 14px 2px 12px; }
  .section-head h2{ font-size:17px; }
  .section-head .count{ font-size:12px; color: var(--text-faint); }

  #grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card{
    background: var(--surface); border:1px solid var(--line); border-radius: var(--radius);
    overflow:hidden; display:flex; flex-direction:column; text-align:left;
  }
  .card-img{
    aspect-ratio: 1/0.9; display:flex; align-items:center; justify-content:center;
    font-size:40px; position:relative;
  }
  .badge{
    position:absolute; top:8px; left:8px; font-size:10px; font-weight:600;
    padding: 3px 8px; border-radius: 20px; color:#111;
  }
  .badge.yangi{ background: var(--teal); color:#0B1210; }
  .badge.chegirma{ background: var(--terracotta); color:#1A0E08; }
  .fav-btn{
    position:absolute; top:8px; right:8px; width:26px; height:26px; border-radius:50%;
    background: rgba(20,23,29,0.55); border:none; color:#fff; font-size:13px;
    display:flex; align-items:center; justify-content:center;
  }
  .fav-btn.active{ color: var(--terracotta); }
  .card-body{ padding: 10px 11px 12px; display:flex; flex-direction:column; gap:4px; }
  .card-brand{ font-size:10px; color: var(--text-faint); text-transform:uppercase; letter-spacing:0.4px; }
  .card-name{ font-size:12.5px; line-height:1.3; color:var(--text); min-height: 32px; }
  .card-price{ font-size:14.5px; font-weight:700; color: var(--gold); margin-top:2px; }
  .card-meta{ display:flex; justify-content:space-between; align-items:center; font-size:10.5px; color:var(--text-faint); }

  .empty{ text-align:center; padding: 60px 20px; color: var(--text-faint); font-size:13px; }

  /* bottom nav */
  #navbar{
    position: sticky; bottom:0; z-index:20;
    display:flex; justify-content:space-around; align-items:center;
    padding: 10px 8px calc(10px + env(safe-area-inset-bottom));
    background: rgba(28,33,42,0.92); backdrop-filter: blur(8px);
    border-top: 1px solid var(--line);
  }
  .nav-btn{
    background:none; border:none; color: var(--text-faint); display:flex; flex-direction:column;
    align-items:center; gap:3px; font-size:10px; width: 64px;
  }
  .nav-btn .ic{ font-size:19px; }
  .nav-btn.active{ color: var(--teal); }

  /* overlay panel (product / admin) */
  .overlay{
    position:absolute; inset:0; z-index:40; background: var(--bg);
    display:flex; flex-direction:column; transform: translateY(100%);
    transition: transform .28s ease;
  }
  .overlay.open{ transform: translateY(0); }
  .ov-head{
    display:flex; align-items:center; gap:12px; padding: 16px; border-bottom:1px solid var(--line);
    position:sticky; top:0; background:var(--bg); z-index:2;
  }
  .back-btn{
    width:32px; height:32px; border-radius:9px; border:1px solid var(--line); background:var(--surface);
    color:var(--text); display:flex; align-items:center; justify-content:center; font-size:16px;
  }
  .ov-body{ flex:1; overflow-y:auto; padding: 0 16px 40px; }

  .p-hero{
    margin: 16px -16px 0; aspect-ratio: 1/0.8; display:flex; align-items:center; justify-content:center;
    font-size: 88px;
  }
  .p-badges{ display:flex; gap:8px; margin: 14px 0 6px; }
  .p-brand{ font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.5px; margin-top:14px; }
  .p-name{ font-size:20px; margin-top:4px; line-height:1.3; }
  .p-price{ font-size:24px; color: var(--gold); font-weight:700; margin-top:10px; font-family:'Space Grotesk'; }
  .p-desc{ font-size:13.5px; color: var(--text-dim); line-height:1.6; margin-top:14px; }
  .p-actions{ display:flex; gap:10px; margin-top:18px; }
  .btn-primary{
    flex:1; background: var(--teal); color:#0B1210; border:none; border-radius:11px; padding:13px;
    font-weight:700; font-size:14px;
  }
  .btn-ghost{
    width:48px; border-radius:11px; border:1px solid var(--line); background:var(--surface); color:var(--text);
    font-size:16px;
  }
  .btn-ghost.active{ color: var(--terracotta); border-color: var(--terracotta); }

  .divider{ height:1px; background:var(--line); margin: 22px 0; }

  /* comments */
  #comments-list{ display:flex; flex-direction:column; gap:14px; margin-top:14px; }
  .comment{ display:flex; gap:10px; }
  .c-avatar{
    width:32px; height:32px; border-radius:50%; background:var(--surface-2); flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:var(--teal);
    border:1px solid var(--line);
  }
  .c-body{ flex:1; }
  .c-top{ display:flex; justify-content:space-between; align-items:baseline; }
  .c-name{ font-size:12.5px; font-weight:600; }
  .c-date{ font-size:10.5px; color:var(--text-faint); }
  .c-text{ font-size:13px; color:var(--text-dim); margin-top:3px; line-height:1.5; }
  .no-comments{ font-size:12.5px; color:var(--text-faint); padding: 6px 0 4px; }

  #comment-form{ display:flex; gap:8px; margin-top:16px; }
  #comment-name, #comment-text{
    background:var(--surface); border:1px solid var(--line); border-radius:10px; color:var(--text);
    padding:10px 12px; font-size:13px; outline:none; font-family:inherit;
  }
  #comment-name{ width: 92px; flex:0 0 auto; }
  #comment-text{ flex:1; }
  #comment-send{ width:40px; border-radius:10px; border:none; background:var(--teal); color:#0B1210; font-size:15px; }

  /* forms (admin) */
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:11.5px; color:var(--text-dim); margin-bottom:6px; }
  .field input, .field select, .field textarea{
    width:100%; background:var(--surface); border:1px solid var(--line); border-radius:10px;
    color:var(--text); padding:11px 12px; font-size:13.5px; font-family:inherit; outline:none;
  }
  .field textarea{ resize:vertical; min-height:70px; }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }
  .emoji-grid{ display:grid; grid-template-columns: repeat(8,1fr); gap:6px; }
  .emoji-opt{
    aspect-ratio:1; border-radius:8px; border:1px solid var(--line); background:var(--surface);
    font-size:17px; display:flex; align-items:center; justify-content:center;
  }
  .emoji-opt.sel{ border-color: var(--teal); background: var(--teal-dim); }

  .admin-list-item{
    display:flex; align-items:center; gap:10px; padding:10px; border:1px solid var(--line); border-radius:11px;
    margin-bottom:8px; background:var(--surface);
  }
  .ali-ic{ width:38px; height:38px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:18px; flex:0 0 auto;}
  .ali-info{ flex:1; min-width:0; }
  .ali-name{ font-size:12.5px; }
  .ali-meta{ font-size:10.5px; color:var(--text-faint); }
  .ali-del{ background:none; border:none; color:var(--terracotta); font-size:16px; padding:4px 6px; }

  .lock-screen{ display:flex; flex-direction:column; align-items:center; justify-content:center; padding: 60px 24px; text-align:center; gap:14px; }
  .lock-screen .ic{ font-size:34px; }
  .lock-screen input{
    width:100%; max-width:220px; background:var(--surface); border:1px solid var(--line); border-radius:10px;
    color:var(--text); padding:11px 12px; text-align:center; font-size:14px; outline:none;
  }
  .lock-screen button{
    background:var(--teal); border:none; border-radius:10px; color:#0B1210; font-weight:700; padding:11px 20px; font-size:13px;
  }
  .lock-err{ color:var(--terracotta); font-size:12px; min-height:14px; }

  .toast{
    position:absolute; left:50%; bottom:90px; transform:translateX(-50%) translateY(10px);
    background: var(--surface-2); border:1px solid var(--line); color:var(--text);
    padding:10px 16px; border-radius:10px; font-size:12.5px; opacity:0; pointer-events:none;
    transition: all .25s ease; z-index:60;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="shell">

  <div id="topbar">
    <div class="brand-row">
      <div class="brand">
        <div class="brand-mark">CH</div>
        <div>
          <div class="brand-name">Chorsu</div>
          <div class="brand-sub">mahalliy bozor</div>
        </div>
      </div>
      <button id="admin-entry" onclick="openAdmin()">⚙</button>
    </div>
    <div id="search-wrap">
      <input id="search" placeholder="Mahsulot qidirish..." oninput="onSearch(this.value)">
    </div>
    <div id="cats"></div>
  </div>

  <div id="main">
    <div class="section-head">
      <h2 id="section-title">Barcha mahsulotlar</h2>
      <span class="count" id="section-count"></span>
    </div>
    <div id="grid"></div>
  </div>

  <div id="navbar">
    <button class="nav-btn active" data-nav="home" onclick="setNav('home')">
      <span class="ic">⌂</span>Bosh
    </button>
    <button class="nav-btn" data-nav="cats" onclick="focusCats()">
      <span class="ic">▦</span>Kategoriya
    </button>
    <button class="nav-btn" data-nav="fav" onclick="setNav('fav')">
      <span class="ic">♥</span>Sevimli
    </button>
    <button class="nav-btn" data-nav="admin" onclick="openAdmin()">
      <span class="ic">⚙</span>Admin
    </button>
  </div>

  <!-- product detail overlay -->
  <div class="overlay" id="product-overlay">
    <div class="ov-head">
      <button class="back-btn" onclick="closeOverlay('product-overlay')">←</button>
      <h3 style="font-size:14px;">Mahsulot</h3>
    </div>
    <div class="ov-body" id="product-body"></div>
  </div>

  <!-- admin overlay -->
  <div class="overlay" id="admin-overlay">
    <div class="ov-head">
      <button class="back-btn" onclick="closeOverlay('admin-overlay')">←</button>
      <h3 style="font-size:14px;">Admin panel</h3>
    </div>
    <div class="ov-body" id="admin-body"></div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
/* ---------------- data ---------------- */
const CATS = [
  { id:'barchasi', label:'Barchasi', icon:'🛍️' },
  { id:'notebook', label:'Noutbuklar', icon:'💻' },
  { id:'erkaklar', label:'Erkaklar', icon:'👔' },
  { id:'ayollar', label:'Ayollar', icon:'👗' },
  { id:'bolalar', label:'Bolalar', icon:'🧸' },
  { id:'kosmetika', label:'Kosmetika', icon:'💄' },
  { id:'dorilar', label:'Dorilar', icon:'💊' },
  { id:'oziqovqat', label:'Oziq-ovqat', icon:'🍏' },
  { id:'uyjihoz', label:'Uy-jihozi', icon:'🏠' },
  { id:'avto', label:'Avto', icon:'🚗' },
  { id:'sovgalar', label:"Sovg'a", icon:'🎁' },
  { id:'aviabilet', label:'Aviabilet', icon:'✈️' },
  { id:'hujjat', label:'Hujjat', icon:'📄' },
];
const GRADIENTS = {
  notebook:'linear-gradient(135deg,#233042,#161c26)', erkaklar:'linear-gradient(135deg,#2b2e3c,#181a22)',
  ayollar:'linear-gradient(135deg,#3a2536,#1c1620)', bolalar:'linear-gradient(135deg,#2e3a2a,#181f16)',
  kosmetika:'linear-gradient(135deg,#3a2a30,#1e161a)', dorilar:'linear-gradient(135deg,#203833,#131f1c)',
  oziqovqat:'linear-gradient(135deg,#3a3320,#1e1a11)', uyjihoz:'linear-gradient(135deg,#2a3038,#161a1e)',
  avto:'linear-gradient(135deg,#2c2620,#191510)', sovgalar:'linear-gradient(135deg,#3a2a1e,#1e1610)',
  aviabilet:'linear-gradient(135deg,#1f2e3a,#12191f)', hujjat:'linear-gradient(135deg,#2a2a2e,#17171a)',
  barchasi:'linear-gradient(135deg,#233042,#161c26)'
};
const EMOJI_CHOICES = ['💻','🖱️','👔','👗','👟','🧸','🎈','💄','🧴','💊','🩹','🍏','🍞','🥤','🏠','🛋️','🚗','🔧','🎁','🎀','✈️','🧳','📄','📎','⌚','🎧','📱','🔌','🧦','🪑'];

const DEFAULT_PRODUCTS = [
  {id:'p1',name:'X-Kraft magnit telefon ushlagich',category:'avto',price:185000,brand:'X-Kraft',badge:'yangi',emoji:'📱',desc:"Avtomobil salonlari uchun kuchli magnitli telefon ushlagich. O'rnatish 30 soniya, barcha telefon modellariga mos keladi."},
  {id:'p2',name:'Mikrofibra tozalash sochig\u02bci',category:'uyjihoz',price:28000,brand:'CleanPro',badge:'chegirma',emoji:'🧽',desc:'Iz qoldirmaydigan, yuqori namlik shimuvchi mikrofibra sochiq. Oyna, mebel va texnika uchun.'},
  {id:'p3',name:'ProBook 14" noutbuk sumkasi',category:'notebook',price:210000,brand:'CarryLine',badge:null,emoji:'💼',desc:"Suv o'tkazmaydigan mato, mustahkam fermuar, yon cho'ntaklar zaryadlovchi uchun."},
  {id:'p4',name:'Klassik erkaklar ko\u02bcylagi',category:'erkaklar',price:165000,brand:'Urban Fit',badge:'yangi',emoji:'👔',desc:'100% paxta mato, ofis va kundalik kiyim uchun qulay kesim. Ranglar: oq, ko\u02bck, kulrang.'},
  {id:'p5',name:'Yozgi ayollar ko\u02bcylagi',category:'ayollar',price:145000,brand:'Nozanin',badge:'chegirma',emoji:'👗',desc:"Yengil shifon mato, keng yozgi fasonda. O'lchamlar 40-52 oralig'ida mavjud."},
  {id:'p6',name:'Bolalar konstruktor to\u02bcplami',category:'bolalar',price:98000,brand:'PlayBrick',badge:'yangi',emoji:'🧱',desc:'120 dona, xavfsiz plastik material. 3 yoshdan oshgan bolalar uchun ijodiy o\u02bcyin.'},
  {id:'p7',name:'Vitamin C serum 30ml',category:'kosmetika',price:112000,brand:'GlowLab',badge:null,emoji:'🧴',desc:'Teri tonusini tenglashtiradi, yorqinlik beradi. Kunduzgi va kechki foydalanish uchun.'},
  {id:'p8',name:'Multivitamin kompleksi',category:'dorilar',price:76000,brand:'VitaPharm',badge:null,emoji:'💊',desc:"Kattalar uchun kunlik multivitamin, 60 dona tabletka. Immunitetni qo'llab-quvvatlaydi."},
  {id:'p9',name:'Organik asal 500g',category:'oziqovqat',price:65000,brand:'Tabiat',badge:'yangi',emoji:'🍯',desc:'Farg\u02bcona vodiysidan tabiiy asal, qo\u02bcshimchalarsiz, shisha idishda.'},
  {id:'p10',name:'Aroma sham to\u02bcplami (3 dona)',category:'uyjihoz',price:89000,brand:'HomeScent',badge:'chegirma',emoji:'🕯️',desc:"Lavanda, vanil va yog'och hidlari. Uzoq yonish vaqti — har biri 20 soat."},
  {id:'p11',name:'Avto interyer parfyum',category:'avto',price:42000,brand:'FreshRide',badge:null,emoji:'🌸',desc:"Salonga yoqimli hid beradi, 60 kungacha ta'sir qiladi."},
  {id:'p12',name:'Doston sovg\u02ba qutisi',category:'sovgalar',price:135000,brand:'Ehson',badge:'yangi',emoji:'🎁',desc:'Shokolad, choy va kartochka bilan tayyor sovg\u02ba to\u02bcplami. Bayram va tug\u02cailgan kun uchun.'},
  {id:'p13',name:'Toshkent — Istanbul chipta yordami',category:'aviabilet',price:1850000,brand:'SkyDesk',badge:null,emoji:'✈️',desc:'Rasmiy agentlik orqali chipta bron qilish xizmati, bagaj va joy tanlash bilan.'},
  {id:'p14',name:'Notarial tarjima xizmati',category:'hujjat',price:55000,brand:'DocLine',badge:null,emoji:'📄',desc:'Diplom, pasport va boshqa hujjatlarni rasmiy tarjima va tasdiqlash.'},
  {id:'p15',name:'Wireless sichqoncha',category:'notebook',price:97000,brand:'X-Kraft',badge:'chegirma',emoji:'🖱️',desc:'Simsiz, sokin bosiladigan tugmalar, batareya 12 oygacha ishlaydi.'},
  {id:'p16',name:"Bolalar issiq kurtka",category:'bolalar',price:220000,brand:'Kids Line',badge:null,emoji:'🧥',desc:"Qishki mavsum uchun issiq va yengil kurtka, suv o'tkazmaydigan tashqi qatlam."},
];

const ADMIN_PASS = 'chorsu2026';

/* ---------------- state ---------------- */
let products = [];
let comments = {};
let favorites = [];
let activeCat = 'barchasi';
let searchQuery = '';
let navMode = 'home';
let adminUnlocked = false;
let selectedEmoji = EMOJI_CHOICES[0];

/* ---------------- storage helpers ---------------- */
async function loadAll(){
  try{
    const r = await window.storage.get('products', true);
    products = r ? JSON.parse(r.value) : DEFAULT_PRODUCTS.slice();
  }catch(e){ products = DEFAULT_PRODUCTS.slice(); }
  if(!products || products.length===0){ products = DEFAULT_PRODUCTS.slice(); await saveProducts(); }

  try{
    const r = await window.storage.get('comments', true);
    comments = r ? JSON.parse(r.value) : {};
  }catch(e){ comments = {}; }

  try{
    const r = await window.storage.get('favorites', false);
    favorites = r ? JSON.parse(r.value) : [];
  }catch(e){ favorites = []; }
}
async function saveProducts(){ try{ await window.storage.set('products', JSON.stringify(products), true); }catch(e){} }
async function saveComments(){ try{ await window.storage.set('comments', JSON.stringify(comments), true); }catch(e){} }
async function saveFavorites(){ try{ await window.storage.set('favorites', JSON.stringify(favorites), false); }catch(e){} }

/* ---------------- render: categories ---------------- */
function renderCats(){
  const wrap = document.getElementById('cats');
  wrap.innerHTML = CATS.map(c => `
    <button class="cat-chip ${activeCat===c.id?'active':''}" onclick="selectCat('${c.id}')">
      <span class="ic">${c.icon}</span>
      <span>${c.label}</span>
    </button>`).join('');
}
function selectCat(id){ activeCat = id; navMode='home'; renderCats(); renderGrid(); updateNavActive(); }
function focusCats(){
  document.getElementById('cats').scrollIntoView({behavior:'smooth', block:'nearest'});
}

/* ---------------- render: grid ---------------- */
function fmtPrice(n){ return n.toLocaleString('ru-RU').replace(/,/g,' ') + " so'm"; }

function currentList(){
  let list = products;
  if(navMode==='fav'){ list = list.filter(p=>favorites.includes(p.id)); }
  else if(activeCat!=='barchasi'){ list = list.filter(p=>p.category===activeCat); }
  if(searchQuery.trim()){
    const q = searchQuery.trim().toLowerCase();
    list = list.filter(p=> p.name.toLowerCase().includes(q) || p.brand.toLowerCase().includes(q));
  }
  return list;
}

function renderGrid(){
  const list = currentList();
  const title = document.getElementById('section-title');
  const count = document.getElementById('section-count');
  if(navMode==='fav'){ title.textContent = 'Sevimlilar'; }
  else { title.textContent = activeCat==='barchasi' ? 'Barcha mahsulotlar' : CATS.find(c=>c.id===activeCat).label; }
  count.textContent = list.length + ' ta';

  const grid = document.getElementById('grid');
  if(list.length===0){
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1;">${navMode==='fav' ? "Hali sevimli mahsulot yo'q. Yurak belgisini bosib qo'shing." : "Bu bo'limda mahsulot topilmadi."}</div>`;
    return;
  }
  grid.innerHTML = list.map(p => `
    <button class="card" onclick="openProduct('${p.id}')">
      <div class="card-img" style="background:${GRADIENTS[p.category]||GRADIENTS.barchasi};">
        ${p.badge ? `<span class="badge ${p.badge}">${p.badge==='yangi'?'Yangi':'Chegirma'}</span>` : ''}
        <button class="fav-btn ${favorites.includes(p.id)?'active':''}" onclick="event.stopPropagation(); toggleFav('${p.id}')">♥</button>
        <span>${p.emoji}</span>
      </div>
      <div class="card-body">
        <div class="card-brand">${p.brand}</div>
        <div class="card-name">${p.name}</div>
        <div class="card-price">${fmtPrice(p.price)}</div>
        <div class="card-meta"><span>${commentCount(p.id)} izoh</span><span>${CATS.find(c=>c.id===p.category)?.label||''}</span></div>
      </div>
    </button>`).join('');
}
function commentCount(id){ return (comments[id]||[]).length; }

function toggleFav(id){
  if(favorites.includes(id)) favorites = favorites.filter(x=>x!==id);
  else favorites.push(id);
  saveFavorites();
  renderGrid();
  if(document.getElementById('product-overlay').classList.contains('open')) renderProductBody(currentProductId);
}

/* ---------------- nav ---------------- */
function setNav(mode){
  navMode = mode;
  updateNavActive();
  renderGrid();
}
function updateNavActive(){
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  if(navMode==='fav') document.querySelector('[data-nav="fav"]').classList.add('active');
  else document.querySelector('[data-nav="home"]').classList.add('active');
}
function onSearch(v){ searchQuery = v; renderGrid(); }

/* ---------------- product overlay ---------------- */
let currentProductId = null;
function openProduct(id){
  currentProductId = id;
  renderProductBody(id);
  document.getElementById('product-overlay').classList.add('open');
}
function closeOverlay(elId){ document.getElementById(elId).classList.remove('open'); }

function renderProductBody(id){
  const p = products.find(x=>x.id===id);
  if(!p) return;
  const isFav = favorites.includes(id);
  const list = comments[id] || [];
  document.getElementById('product-body').innerHTML = `
    <div class="p-hero" style="background:${GRADIENTS[p.category]||GRADIENTS.barchasi};">${p.emoji}</div>
    <div class="p-badges">${p.badge? `<span class="badge ${p.badge}" style="position:static;">${p.badge==='yangi'?'Yangi':'Chegirma'}</span>`:''}</div>
    <div class="p-brand">${p.brand}</div>
    <h1 class="p-name">${p.name}</h1>
    <div class="p-price">${fmtPrice(p.price)}</div>
    <p class="p-desc">${p.desc}</p>
    <div class="p-actions">
      <button class="btn-primary" onclick="showToast('Buyurtma so\\'rovi yuborildi')">Buyurtma berish</button>
      <button class="btn-ghost ${isFav?'active':''}" onclick="toggleFav('${p.id}')">♥</button>
    </div>
    <div class="divider"></div>
    <h3 style="font-size:14px;">Izohlar <span style="color:var(--text-faint); font-weight:400;">(${list.length})</span></h3>
    <div id="comments-list">
      ${list.length===0 ? '<div class="no-comments">Hali izoh yo\\'q. Birinchi bo\\'lib fikr qoldiring.</div>' :
        list.map(c => `
        <div class="comment">
          <div class="c-avatar">${c.name.trim()[0]?.toUpperCase()||'?'}</div>
          <div class="c-body">
            <div class="c-top"><span class="c-name">${escapeHtml(c.name)}</span><span class="c-date">${c.date}</span></div>
            <div class="c-text">${escapeHtml(c.text)}</div>
          </div>
        </div>`).join('')}
    </div>
    <form id="comment-form" onsubmit="return submitComment(event,'${p.id}')">
      <input id="comment-name" placeholder="Ism" required maxlength="24">
      <input id="comment-text" placeholder="Izoh yozing..." required maxlength="240">
      <button id="comment-send" type="submit">➤</button>
    </form>
  `;
}
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

async function submitComment(ev, productId){
  ev.preventDefault();
  const name = document.getElementById('comment-name').value.trim();
  const text = document.getElementById('comment-text').value.trim();
  if(!name || !text) return false;
  const entry = { id: 'c'+Date.now(), name, text, date: new Date().toLocaleDateString('uz-UZ',{day:'2-digit',month:'2-digit',year:'numeric'}) };
  if(!comments[productId]) comments[productId] = [];
  comments[productId].push(entry);
  await saveComments();
  renderProductBody(productId);
  renderGrid();
  return false;
}

/* ---------------- admin ---------------- */
function openAdmin(){
  document.getElementById('admin-overlay').classList.add('open');
  renderAdmin();
}
function renderAdmin(){
  const body = document.getElementById('admin-body');
  if(!adminUnlocked){
    body.innerHTML = `
      <div class="lock-screen">
        <div class="ic">🔒</div>
        <div>
          <div style="font-size:15px; margin-bottom:4px;">Admin panelga kirish</div>
          <div style="font-size:12px; color:var(--text-faint);">Mahsulot joylash uchun parolni kiriting</div>
        </div>
        <input id="admin-pass" type="password" placeholder="Parol">
        <div class="lock-err" id="lock-err"></div>
        <button onclick="tryUnlock()">Kirish</button>
      </div>`;
    return;
  }
  const catOptions = CATS.filter(c=>c.id!=='barchasi').map(c=>`<option value="${c.id}">${c.label}</option>`).join('');
  body.innerHTML = `
    <h3 style="font-size:15px; margin:16px 0 4px;">Yangi mahsulot qo'shish</h3>
    <p style="font-size:12px; color:var(--text-faint); margin:0 0 16px;">Ma'lumotlar barcha foydalanuvchilarga ko'rinadigan umumiy bozor bazasiga saqlanadi.</p>
    <form id="admin-form" onsubmit="return submitProduct(event)">
      <div class="field"><label>Mahsulot nomi</label><input id="f-name" required maxlength="70" placeholder="Masalan: Wireless quloqchin"></div>
      <div class="field-row">
        <div class="field"><label>Kategoriya</label><select id="f-cat">${catOptions}</select></div>
        <div class="field"><label>Narx (so'm)</label><input id="f-price" type="number" min="0" required placeholder="150000"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Brend</label><input id="f-brand" maxlength="30" placeholder="Masalan: X-Kraft"></div>
        <div class="field"><label>Belgi</label>
          <select id="f-badge"><option value="">Yo'q</option><option value="yangi">Yangi</option><option value="chegirma">Chegirma</option></select>
        </div>
      </div>
      <div class="field"><label>Tavsif</label><textarea id="f-desc" maxlength="300" placeholder="Mahsulot haqida qisqacha..."></textarea></div>
      <div class="field"><label>Belgi (ikonka)</label>
        <div class="emoji-grid" id="emoji-grid"></div>
      </div>
      <button class="btn-primary" type="submit" style="width:100%; margin-top:6px;">Mahsulotni joylash</button>
    </form>
    <div class="divider"></div>
    <h3 style="font-size:15px; margin-bottom:12px;">Mavjud mahsulotlar (${products.length})</h3>
    <div id="admin-list"></div>
  `;
  const eg = document.getElementById('emoji-grid');
  eg.innerHTML = EMOJI_CHOICES.map(e=>`<button type="button" class="emoji-opt ${e===selectedEmoji?'sel':''}" onclick="pickEmoji('${e}')">${e}</button>`).join('');
  renderAdminList();
}
function pickEmoji(e){
  selectedEmoji = e;
  document.querySelectorAll('.emoji-opt').forEach(b=>b.classList.toggle('sel', b.textContent===e));
}
function renderAdminList(){
  const wrap = document.getElementById('admin-list');
  wrap.innerHTML = products.map(p=>`
    <div class="admin-list-item">
      <div class="ali-ic" style="background:${GRADIENTS[p.category]||GRADIENTS.barchasi};">${p.emoji}</div>
      <div class="ali-info">
        <div class="ali-name">${p.name}</div>
        <div class="ali-meta">${CATS.find(c=>c.id===p.category)?.label||''} · ${fmtPrice(p.price)}</div>
      </div>
      <button class="ali-del" onclick="deleteProduct('${p.id}')">✕</button>
    </div>`).join('');
}
function tryUnlock(){
  const val = document.getElementById('admin-pass').value;
  if(val === ADMIN_PASS){ adminUnlocked = true; renderAdmin(); }
  else{ document.getElementById('lock-err').textContent = "Parol noto'g'ri"; }
}
async function submitProduct(ev){
  ev.preventDefault();
  const name = document.getElementById('f-name').value.trim();
  const category = document.getElementById('f-cat').value;
  const price = parseInt(document.getElementById('f-price').value,10) || 0;
  const brand = document.getElementById('f-brand').value.trim() || "Noma'lum";
  const badge = document.getElementById('f-badge').value || null;
  const desc = document.getElementById('f-desc').value.trim() || "Tavsif kiritilmagan.";
  const p = { id: 'p'+Date.now(), name, category, price, brand, badge, desc, emoji: selectedEmoji };
  products.unshift(p);
  await saveProducts();
  selectedEmoji = EMOJI_CHOICES[0];
  renderAdmin();
  renderGrid();
  showToast('Mahsulot joylandi');
  return false;
}
async function deleteProduct(id){
  products = products.filter(p=>p.id!==id);
  await saveProducts();
  renderAdminList();
  renderGrid();
  showToast("Mahsulot o'chirildi");
}

/* ---------------- toast ---------------- */
let toastTimer=null;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ---------------- init ---------------- */
async function init(){
  renderCats();
  document.getElementById('grid').innerHTML = '<div class="empty" style="grid-column:1/-1;">Yuklanmoqda...</div>';
  await loadAll();
  renderGrid();
}
init();
</script>
</body>
</html>
